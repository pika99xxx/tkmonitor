<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TK 推广视频数据看板</title><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="minimal-theme.css"></head>
<body><aside><div class="logo"><i>TK</i><div><b>推广视频雷达</b><span>Creator monitor</span></div></div><nav><button class="active" data-view="overview">总览</button><button data-view="history">历史记录</button><button data-view="settings">巡检设置</button></nav><div class="local">数据仅保存在本机浏览器</div></aside>
<main><header><div><p class="eyebrow">CREATOR PERFORMANCE</p><h1>达人推广视频</h1><p id="subtitle">集中查看每位达人的匹配结果</p></div><div class="headActions"><span id="scanState" class="status">待机</span><button id="export">导出结果</button><button id="pause">暂停</button><button id="resume">继续</button><button id="restart">重新开始</button><button id="start" class="primary">开始巡检</button></div></header>
<section id="overview" class="view active"><div class="summary"><article><span>达人</span><b id="creatorTotal">0</b></article><article><span>符合条件的视频</span><b id="matchTotal">0</b></article><article><span>本轮已检查</span><b id="checkedTotal">0</b></article><article><span>巡检进度</span><b id="progressText">0 / 0</b></article></div><div class="progress"><i id="progressBar"></i></div><div id="creatorGrid" class="creatorGrid"></div></section>
<section id="history" class="view"><div class="historyHead"><div><h2>查询历史</h2><p>保存每次巡检及手动复查时的数据快照</p></div><button id="clearHistory">清空历史</button></div><div id="historyList" class="historyList"></div></section>
<section id="settings" class="view"><div class="settingsCard"><div class="field"><label>达人名单 <small>每行一个账号，不用输入 @</small></label><textarea id="creators" placeholder="creator_one&#10;creator_two"></textarea><small>只需填写达人账号；视频实际发布日期、链接和公开数据会自动记录。</small></div>
<div class="settingRow"><div class="field"><label>匹配方式</label><select id="mode"><option value="any">满足其中之一</option><option value="all">必须满足全部</option></select></div><div class="field"><label>每位达人读取最近几条</label><input id="recentCount" type="number" min="1" max="100" value="3"><small>范围 1–100；另加载 3 条以抵消置顶内容</small></div></div>
<div class="field"><label><span>组合筛选条件</span><small>推荐每行一个；也支持逗号或分号</small></label><div id="tagOptions" class="tagOptions"><button data-token="#fufugaga">#fufugaga</button><button data-token="@FUFU&amp;GAGA">@FUFU&amp;GAGA</button><button data-token="#furniture">#furniture</button><button data-token="#homedecor">#homedecor</button><button data-token="#interiordesign">#interiordesign</button><button data-token="#sofa">#sofa</button><button data-token="#bedroom">#bedroom</button><button data-token="#livingroom">#livingroom</button><button data-token="#homeimprovement">#homeimprovement</button><button data-token="#amazonfinds">#amazonfinds</button></div><textarea id="criteria" class="criteriaInput" placeholder="#furniture&#10;@brandname&#10;sofa discount"></textarea><small>识别方式：# 开头为 Tag，@ 开头为账号，无前缀为文案关键词。分隔符支持换行、,、，、;、；，不会按空格拆分。</small></div>
<button id="save" class="primary">保存巡检设置</button></div></section></main><script src="dashboard.js"></script></body></html>
